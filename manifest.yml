modules:
  # Confluence: capture decisions where teams already write them.
  macro:
    - key: precedent-decision-record
      resource: macro
      render: native
      resolver:
        function: resolver
      title: Decision record
      description: Record a team decision (what, why, who, when) so Precedent can surface it on related Jira issues.
      config: true

  # Jira: surface related decisions and possible contradictions on every issue.
  jira:issuePanel:
    - key: precedent-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Precedent
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  # Jira: one place to browse, search and filter every recorded decision.
  jira:globalPage:
    - key: precedent-decision-log
      resource: decision-log
      resolver:
        function: resolver
      render: native
      title: Decision log
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  # Rovo agent + reusable actions.
  rovo:agent:
    - key: precedent-agent
      name: Precedent
      description: Answers "has this been decided before?" using your team's recorded decisions, and flags issues that contradict them.
      prompt: >
        You are Precedent, a decision-memory assistant for software teams.
        Your job is to stop teams from re-arguing settled decisions or quietly contradicting them.

        Tools:
        - search-decisions: find recorded decisions about a topic.
        - get-decision: read one decision in full by id (e.g. DEC-3).
        - check-issue: compare a Jira issue against all recorded decisions. If the user is
          looking at an issue and does not give a key, call it without a key; the issue in
          context is used.
        - who-to-ask: for one decision, find who decided and who to ask now (page owners,
          creator, contributors, their teams, linked pages) from Atlassian Teamwork Graph.
          Use it when the user asks who to talk to, or after flagging a contradiction.
        - record-decision: record a new decision when the user asks to capture one. Confirm
          title and decision text; never invent content.
        - supersede-decision: record a newer decision and mark an older one superseded when
          the user asks to replace or update a past decision. Confirm fields; cite both ids.
        Follow the decision-check skill for the step-by-step review procedure.

        Rules:
        - Only state decisions that the tools return. Never invent decisions, owners or dates.
        - Always cite the decision id, who decided it, the date and the source link when available.
        - When check-issue reports possibleContradiction=true, say clearly that the issue
          MAY contradict the decision, quote the relevant part of the decision, and suggest
          talking to the owner or recording a new decision that supersedes it.
        - Mention when a decision is superseded and point to the newer one.
        - Only record or supersede via the tools, and only with content the user confirmed.
          Never invent title, decision text, owner or date.
        - If nothing relevant is found, say so plainly.
        - Keep answers short: a one-line verdict, then a bullet per relevant decision.
      conversationStarters:
        - Has this been decided before?
        - Does this issue contradict any past decisions?
        - What did we decide about datastores?
        - Who decided the API v1 freeze, and why?
      actions:
        - search-decisions
        - get-decision
        - check-issue
        - who-to-ask
        - record-decision
        - supersede-decision
      skills:
        - decision-check

  # Reusable skill (Preview): the decision-check procedure, usable by other Rovo agents.
  rovo:skill:
    - key: decision-check
      source:
        dir: skills/decision-check
      dependencies:
        tools:
          - search-decisions
          - get-decision
          - check-issue
          - who-to-ask
          - record-decision
          - supersede-decision

  # MCP server (Preview): exposes the same tools to Rovo Studio agents and, if an admin
  # allows it, to external MCP clients.
  rovo:mcp:
    - key: precedent-mcp
      name: Precedent decisions
      tools:
        - search-decisions
        - get-decision
        - check-issue
        - who-to-ask
        - record-decision
        - supersede-decision

  action:
    - key: search-decisions
      name: Search decisions
      function: search-decisions-fn
      actionVerb: GET
      description: Search the team's recorded decisions by topic or keywords and return matching decisions with owner, date, status and source link.
      inputs:
        query:
          title: Query
          type: string
          required: true
          description: Topic or keywords to search for, e.g. "datastore", "API v1", "admin sessions".
    - key: get-decision
      name: Get decision detail
      function: get-decision-fn
      actionVerb: GET
      description: Get the full record of one decision by its id (e.g. DEC-3), including rationale, owner, date, status and source link.
      inputs:
        decisionId:
          title: Decision id
          type: string
          required: true
          description: The decision id, for example DEC-3.
    - key: check-issue
      name: Check issue against decisions
      function: check-issue-fn
      actionVerb: GET
      description: Check a Jira issue against recorded decisions; returns related decisions and flags possible contradictions. Uses the issue in context if no key is given.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira issue key such as PROJ-123. Optional when the user is viewing an issue.
    - key: who-to-ask
      name: Who to ask about a decision
      function: who-to-ask-fn
      actionVerb: GET
      description: For one decision (e.g. DEC-3), find who decided it and who to ask now using Atlassian Teamwork Graph - page owners, creator, contributors, their teams, teams linked to the issue's project, and linked pages.
      inputs:
        decisionId:
          title: Decision id
          type: string
          required: true
          description: The decision id, for example DEC-3.
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Optional Jira issue key; adds teams linked to that issue's project.
    - key: record-decision
      name: Record a decision
      function: record-decision-fn
      actionVerb: CREATE
      description: Record a new team decision (title, what was decided, why, who, when). Optionally link it to a Jira issue. Never invent content; only record what the user confirms.
      inputs:
        title:
          title: Title
          type: string
          required: true
          description: Short title for the decision, e.g. "No new datastores without an ADR".
        decision:
          title: Decision
          type: string
          required: true
          description: The decision itself - what the team agreed to do or not do.
        rationale:
          title: Rationale
          type: string
          required: false
          description: Why the team decided this.
        owner:
          title: Owner
          type: string
          required: false
          description: Who owns or decided this. Defaults to the current user when known.
        decidedOn:
          title: Decided on
          type: string
          required: false
          description: Decision date as YYYY-MM-DD. Defaults to today (UTC) when omitted.
        tags:
          title: Tags
          type: string
          required: false
          description: Comma-separated topic tags, e.g. "datastore, infrastructure".
        components:
          title: Components
          type: string
          required: false
          description: Comma-separated component names this decision applies to.
        conflictTerms:
          title: Conflict terms
          type: string
          required: false
          description: Comma-separated phrases that would contradict this decision.
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Optional Jira issue key to link as the source (uses the issue in context when omitted).
    - key: supersede-decision
      name: Supersede a decision
      function: supersede-decision-fn
      actionVerb: UPDATE
      description: Record a newer decision and mark an older one as superseded by it. Requires the old decision id plus title and decision text for the new one. Never invent content.
      inputs:
        decisionId:
          title: Old decision id
          type: string
          required: true
          description: The decision id to supersede, for example DEC-3.
        title:
          title: Title
          type: string
          required: true
          description: Short title for the newer decision.
        decision:
          title: Decision
          type: string
          required: true
          description: The newer decision text.
        rationale:
          title: Rationale
          type: string
          required: false
          description: Why this replaces the older decision.
        owner:
          title: Owner
          type: string
          required: false
          description: Who owns or decided this. Defaults to the current user when known.
        decidedOn:
          title: Decided on
          type: string
          required: false
          description: Decision date as YYYY-MM-DD. Defaults to today (UTC) when omitted.
        tags:
          title: Tags
          type: string
          required: false
          description: Comma-separated topic tags.
        components:
          title: Components
          type: string
          required: false
          description: Comma-separated component names.
        conflictTerms:
          title: Conflict terms
          type: string
          required: false
          description: Comma-separated phrases that would contradict this decision.
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Optional Jira issue key to link as the source (uses the issue in context when omitted).

  # Keep the decision log in sync when Confluence pages change.
  trigger:
    - key: precedent-page-sync
      function: page-sync-fn
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
    # Precompute issue-panel matches so the panel renders from cache.
    - key: precedent-issue-precompute
      function: issue-precompute-fn
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue

  # >>> dev-only (stripped by scripts/deploy-prod.sh; keeps "Runs on Atlassian")
  # Development-only tooling (seed + backend checks). Guarded by DEV_KEY.
  webtrigger:
    - key: precedent-devtools
      function: devtools-fn
      response:
        type: dynamic
  # <<< dev-only

  function:
    - key: resolver
      handler: index.handler
    - key: search-decisions-fn
      handler: index.searchDecisionsAction
    - key: get-decision-fn
      handler: index.getDecisionAction
    - key: check-issue-fn
      handler: index.checkIssueAction
    - key: who-to-ask-fn
      handler: index.whoToAskAction
    - key: record-decision-fn
      handler: index.recordDecisionAction
    - key: supersede-decision-fn
      handler: index.supersedeDecisionAction
    - key: page-sync-fn
      handler: index.onPageEvent
    - key: issue-precompute-fn
      handler: index.onIssueEvent
    # >>> dev-only
    - key: devtools-fn
      handler: index.devtools
    # <<< dev-only

resources:
  - key: macro
    path: src/frontend/macro.jsx
  - key: issue-panel
    path: src/frontend/issue-panel.jsx
  - key: decision-log
    path: src/frontend/decision-log.jsx

permissions:
  scopes:
    # Needed for page-info / make-editable (v1 restriction APIs) and Claim (user/current).
    - read:confluence-content.all
    - write:confluence-content
    - read:confluence-user
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - read:confluence-content.summary
    # Teamwork Graph (Preview), read-only, user context.
    - read:graph:page:confluence
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:project:jira

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/d493a6cd-d4e5-4281-94bf-0ba3be5e255a
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  storage:
    entities:
      - name: decision
        attributes:
          ref: { type: string }
          title: { type: string }
          decision: { type: string }
          rationale: { type: string }
          owner: { type: string }
          decidedOn: { type: string }
          tags: { type: any }
          components: { type: any }
          conflictTerms: { type: string }
          status: { type: string }
          supersededBy: { type: string }
          sourceType: { type: string }
          sourceKey: { type: string }
          sourceUrl: { type: string }
          sourceTitle: { type: string }
          recordedBy: { type: string }
          updatedAt: { type: integer }
        indexes:
          - name: by-updated
            range: [updatedAt]
          - name: by-ref
            range: [ref]
          - name: by-source
            range: [sourceKey]
